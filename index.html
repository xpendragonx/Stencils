<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stencil — B/W/Gray Poster Tool</title>
<style>
  :root{
    --ink:#111214;
    --paper:#eeece6;
    --paper-dim:#e2dfd6;
    --line:#111214;
    --accent:#c22a1f; /* stencil-red ink */
    --gray-swatch:#909090;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Helvetica Neue', Arial, sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
  }
  header{
    border-bottom:4px solid var(--ink);
    padding-bottom:14px;
    margin-bottom:28px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:8px;
  }
  h1{
    font-family:'Impact','Arial Narrow',sans-serif;
    font-weight:400;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:clamp(32px,6vw,52px);
    margin:0;
    line-height:0.9;
  }
  h1 span{color:var(--accent);}
  .sub{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--ink);
    opacity:0.65;
    margin:0;
  }

  .dropzone{
    border:3px dashed var(--ink);
    background:var(--paper-dim);
    padding:36px 20px;
    text-align:center;
    cursor:pointer;
    transition:background 0.15s ease, border-color 0.15s ease;
    position:relative;
  }
  .dropzone.dragover{
    background:#d9d2c2;
    border-color:var(--accent);
  }
  .dropzone p{
    margin:0 0 14px;
    font-size:15px;
    letter-spacing:0.3px;
  }
  .dropzone .hint{
    font-size:12px;
    opacity:0.55;
    margin-top:8px;
  }
  button{
    font-family:inherit;
    cursor:pointer;
  }
  .file-btn{
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--ink);
    padding:10px 22px;
    font-size:13px;
    letter-spacing:1px;
    text-transform:uppercase;
    font-weight:700;
  }
  .file-btn:hover{background:var(--accent);border-color:var(--accent);}
  input[type="file"]{display:none;}

  .stage{
    margin-top:28px;
    display:none;
  }
  .stage.active{display:block;}

  .canvas-frame{
    border:3px solid var(--ink);
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    max-height:70vh;
  }
  canvas{
    display:block;
    max-width:100%;
    max-height:70vh;
    height:auto;
    width:auto;
  }

  .controls{
    margin-top:22px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
  }
  @media (max-width:560px){
    .controls{grid-template-columns:1fr;}
  }
  .control{
    background:var(--paper-dim);
    border:2px solid var(--ink);
    padding:16px 18px 18px;
  }
  .control-label{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .control-label .name{
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    font-weight:700;
  }
  .control-label .val{
    font-variant-numeric:tabular-nums;
    font-size:13px;
    opacity:0.75;
  }
  .swatch-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .swatch{
    width:16px;height:16px;
    border:1px solid var(--ink);
    flex-shrink:0;
  }
  input[type="range"]{
    width:100%;
    -webkit-appearance:none;
    appearance:none;
    height:6px;
    background:var(--ink);
    outline:none;
    margin-top:4px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    appearance:none;
    width:20px;height:20px;
    background:var(--accent);
    border:2px solid var(--ink);
    border-radius:50%;
    cursor:pointer;
    margin-top:-7px;
  }
  input[type="range"]::-moz-range-thumb{
    width:18px;height:18px;
    background:var(--accent);
    border:2px solid var(--ink);
    border-radius:50%;
    cursor:pointer;
  }
  input[type="range"]::-moz-range-track{
    height:6px;
    background:var(--ink);
  }

  .gray-note{
    margin-top:22px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:12px;
    letter-spacing:0.5px;
    opacity:0.7;
  }
  .gray-note .swatch{width:14px;height:14px;background:var(--gray-swatch);}

  .actions{
    margin-top:24px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .action-btn{
    background:var(--ink);
    color:var(--paper);
    border:2px solid var(--ink);
    padding:12px 26px;
    font-size:13px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
  }
  .action-btn:hover{background:var(--accent);border-color:var(--accent);}
  .action-btn.secondary{
    background:transparent;
    color:var(--ink);
  }
  .action-btn.secondary:hover{
    background:var(--ink);
    color:var(--paper);
  }

  .warn{
    font-size:12px;
    color:var(--accent);
    margin-top:10px;
    min-height:14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Stencils<span>.</span></h1>
      <p class="sub">Black / White / Gray photo posterizer | By: little marks education</p>
    </div>
  </header>

  <div class="dropzone" id="dropzone">
    <p>Drag &amp; drop a photo here</p>
    <button type="button" class="file-btn" id="fileBtn">Choose File</button>
    <input type="file" id="fileInput" accept="image/*">
    <p class="hint">JPG, PNG, or WebP</p>
  </div>

  <div class="stage" id="stage">
    <div class="canvas-frame">
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <div class="control">
        <div class="control-label">
          <span class="name">Black Point</span>
          <span class="val" id="blackVal">85</span>
        </div>
        <div class="swatch-row"><div class="swatch" style="background:#000"></div><span style="font-size:11px;opacity:.6">pixels below this &rarr; pure black</span></div>
        <input type="range" id="blackSlider" min="0" max="255" value="85">
      </div>
      <div class="control">
        <div class="control-label">
          <span class="name">White Point</span>
          <span class="val" id="whiteVal">170</span>
        </div>
        <div class="swatch-row"><div class="swatch" style="background:#fff"></div><span style="font-size:11px;opacity:.6">pixels above this &rarr; pure white</span></div>
        <input type="range" id="whiteSlider" min="0" max="255" value="170">
      </div>
    </div>

    <!-- <div class="gray-note"><div class="swatch"></div> everything in between fills flat #909090</div> -->
    <div class="warn" id="warn"></div>

    <div class="actions">
      <button type="button" class="action-btn" id="downloadBtn">Download PNG</button>
      <button type="button" class="action-btn secondary" id="newBtn">Upload Different Photo</button>
    </div>
  </div>
</div>

<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  const fileBtn = document.getElementById('fileBtn');
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const blackSlider = document.getElementById('blackSlider');
  const whiteSlider = document.getElementById('whiteSlider');
  const blackVal = document.getElementById('blackVal');
  const whiteVal = document.getElementById('whiteVal');
  const downloadBtn = document.getElementById('downloadBtn');
  const newBtn = document.getElementById('newBtn');
  const warn = document.getElementById('warn');

  let grayData = null;   // Uint8ClampedArray of per-pixel luminance, computed once per image
  let width = 0, height = 0;
  let outImageData = null; // reused output buffer
  let rafPending = false;
  let sourceFileName = 'photo';

  const GRAY = 144; // 0x90 = 144 -> #909090

  function loadFile(file){
    if(!file || !file.type.startsWith('image/')) return;
    sourceFileName = file.name.replace(/\.[^.]+$/, '') || 'photo';
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = function(){
      width = img.naturalWidth;
      height = img.naturalHeight;
      canvas.width = width;
      canvas.height = height;

      // Draw original once to extract RGB, at full native resolution
      ctx.drawImage(img, 0, 0, width, height);
      const srcData = ctx.getImageData(0, 0, width, height);
      const src = srcData.data;

      grayData = new Uint8ClampedArray(width * height);
      for(let i = 0, p = 0; i < src.length; i += 4, p++){
        // Rec.601 luminance weighting
        grayData[p] = 0.299 * src[i] + 0.587 * src[i+1] + 0.114 * src[i+2];
      }

      outImageData = ctx.createImageData(width, height);
      // alpha channel is always opaque
      for(let i = 3; i < outImageData.data.length; i += 4){
        outImageData.data[i] = 255;
      }

      URL.revokeObjectURL(url);
      stage.classList.add('active');
      render();
    };
    img.onerror = function(){
      warn.textContent = 'Could not load that image — try a different file.';
      URL.revokeObjectURL(url);
    };
    img.src = url;
  }

  function render(){
    if(!grayData) return;
    let b = parseInt(blackSlider.value, 10);
    let w = parseInt(whiteSlider.value, 10);

    // mutual clamp: keep at least 1 unit of gray band between them
    if(b >= w){
      // whichever the user is actively dragging "wins"; we clamp the other
      if(document.activeElement === blackSlider){
        b = Math.min(b, 254);
        w = Math.max(w, b + 1);
        whiteSlider.value = w;
      } else {
        w = Math.max(w, 1);
        b = Math.min(b, w - 1);
        blackSlider.value = b;
      }
    }

    blackVal.textContent = b;
    whiteVal.textContent = w;

    const out = outImageData.data;
    for(let p = 0, i = 0; p < grayData.length; p++, i += 4){
      const g = grayData[p];
      let v;
      if(g <= b) v = 0;
      else if(g >= w) v = 255;
      else v = GRAY;
      out[i] = v;
      out[i+1] = v;
      out[i+2] = v;
    }
    ctx.putImageData(outImageData, 0, 0);
  }

  function scheduleRender(){
    if(rafPending) return;
    rafPending = true;
    requestAnimationFrame(function(){
      rafPending = false;
      render();
    });
  }

  // --- Upload handlers ---
  fileBtn.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('click', (e) => {
    if(e.target === fileBtn) return;
    fileInput.click();
  });
  fileInput.addEventListener('change', (e) => {
    if(e.target.files && e.target.files[0]) loadFile(e.target.files[0]);
  });

  ['dragenter','dragover'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
  });
  ['dragleave','drop'].forEach(evt => {
    dropzone.addEventListener(evt, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    });
  });
  dropzone.addEventListener('drop', (e) => {
    const file = e.dataTransfer.files && e.dataTransfer.files[0];
    if(file) loadFile(file);
  });

  // --- Sliders ---
  blackSlider.addEventListener('input', scheduleRender);
  whiteSlider.addEventListener('input', scheduleRender);

  // --- Download ---
  downloadBtn.addEventListener('click', () => {
    canvas.toBlob(function(blob){
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'stencil-' + sourceFileName + '.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png', 1.0);
  });

  // --- Reset ---
  newBtn.addEventListener('click', () => {
    stage.classList.remove('active');
    grayData = null;
    fileInput.value = '';
    warn.textContent = '';
  });
})();
</script>
</body>
</html>
